name: Build and Release Firmware

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # required to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install cores
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json \
            https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli core install m5stack:esp32@3.3.7

      - name: Install libraries
        run: |
          arduino-cli lib install "M5Unified" "M5GFX" "JPEGDEC" "LovyanGFX" "XPT2046_Touchscreen"

      - name: Inject ScreenScraper credentials
        env:
          SS_DEV_ID:   ${{ secrets.SS_DEV_ID }}
          SS_DEV_PASS: ${{ secrets.SS_DEV_PASS }}
        run: |
          for d in mister_monitor_Tab5 mister_monitor_Guition10inch mister_monitor_CYD28R_ILI9341 mister_monitor_CYD28R_ST7789 mister_monitor_CYD35C mister_monitor_CYD35R; do
            printf '#pragma once\n#define SS_DEV_ID_EMBEDDED   "%s"\n#define SS_DEV_PASS_EMBEDDED "%s"\n' \
              "$SS_DEV_ID" "$SS_DEV_PASS" > "$d/ss_credentials.h"
          done

      - name: Compile Tab5
        run: |
          arduino-cli compile \
            --fqbn "m5stack:esp32:m5stack_tab5" \
            --output-dir build/tab5 \
            mister_monitor_Tab5

      - name: Compile Guition 10.1 inch
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32p4:ChipVariant=prev3,PSRAM=enabled,FlashMode=qio,FlashFreq=80,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB" \
            --output-dir build/guition10inch \
            mister_monitor_Guition10inch

      # ESP32-P4 v3.x silicon cannot run images built for earlier revisions
      # (and vice versa), so recent Guition units get their own build.
      - name: Compile Guition 10.1 inch (ESP32-P4 v3)
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32p4:ChipVariant=postv3,PSRAM=enabled,FlashMode=qio,FlashFreq=80,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB" \
            --output-dir build/guition10inch_v3 \
            mister_monitor_Guition10inch

      - name: Compile CYD 2.8" ILI9341
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd_ili9341 \
            mister_monitor_CYD28R_ILI9341

      - name: Compile CYD 2.8" ST7789
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd_st7789 \
            mister_monitor_CYD28R_ST7789

      - name: Compile CYD35C
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd35c \
            mister_monitor_CYD35C

      - name: Compile CYD35R
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd35r \
            mister_monitor_CYD35R

      - name: Collect binaries
        run: |
          mkdir -p dist
          cp build/tab5/mister_monitor_Tab5.ino.merged.bin dist/mister_monitor_tab5.bin
          cp build/guition10inch/mister_monitor_Guition10inch.ino.merged.bin dist/mister_monitor_guition10inch.bin
          cp build/guition10inch_v3/mister_monitor_Guition10inch.ino.merged.bin dist/mister_monitor_guition10inch_v3.bin
          cp build/cyd_ili9341/mister_monitor_CYD28R_ILI9341.ino.merged.bin dist/mister_monitor_cyd_ili9341.bin
          cp build/cyd_st7789/mister_monitor_CYD28R_ST7789.ino.merged.bin dist/mister_monitor_cyd_st7789.bin
          cp build/cyd35c/mister_monitor_CYD35C.ino.merged.bin dist/mister_monitor_cyd35c.bin
          cp build/cyd35r/mister_monitor_CYD35R.ino.merged.bin dist/mister_monitor_cyd35r.bin

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          body: |
            ### New

            - **Guition boards with the ESP32-P4 v3 chip are supported.** Recent Guition batches carry a newer revision of the ESP32-P4 that cannot run firmware built for the earlier one, so there is now a second build, `mister_monitor_guition10inch_v3.bin`. On these units the standard build restarts in a loop right after flashing, with nothing on the serial log after `entry`. The v3 build also needed a display fix: the panel driver asked for a clock that only exists on the older chip, which made v3 units stop silently at boot. Thanks to @pxpxpxp (#33) for tracking it down on real hardware, and to @ChunkyLoverMark for testing every step.

            ### Fixes

            - **The Guition no longer restarts in a loop after updating to 2.11.0.** The `c6_firmware.bin` shipped in `SD_card_content/Guition/` with 2.11.0 was an older coprocessor image than the firmware expects, so the display flashed it, restarted, found the coprocessor still behind and flashed it again. The file is now the right one (ESP-Hosted 2.12.13), and the firmware protects itself either way: an image older than it needs is refused with a message instead of flashed, and an update that completes but leaves the coprocessor on its old version is not repeated.
            - **Coprocessor messages on the Guition are readable.** They were drawn where the connection animation repaints and came out in fragments; they now have their own line below it.

            ### Notes

            - **Guition on 2.11.0: replace `c6_firmware.bin` on your card** with the one in `SD_card_content/Guition/`. The new file is 1,226,976 bytes; the old one is 1,226,800. This applies whether or not your display was looping.
            - **Which Guition build?** So far the v3 chip has come on units whose sticker SKU ends in `-V3`, for example `10153001-V3 (2637)`. esptool also reports it when it connects: `Chip is ESP32-P4 (revision v3.x)`. Flashing the wrong build does no harm; it just does not start, and you flash the other one. v3 units are all from batch 2624 onward, so they also need `panel_rev=v2`.
            - **v3 units: flash from Espressif's browser tool or with esptool.** The web flasher cannot talk to the v3 chip yet. Download `mister_monitor_guition10inch_v3.bin` from this release and either flash it at address `0x0` from [espressif.github.io/esptool-js](https://espressif.github.io/esptool-js/) (set the baud rate to 115200 before connecting), or run `esptool --chip esp32p4 write-flash 0x0 mister_monitor_guition10inch_v3.bin`. Step by step in [installation.md](https://github.com/chipster6502/MiSTer_monitor/blob/main/docs/installation.md#guition-jc8012p4a1c).
            - **Guition: use the USB-C port marked USB UART**, the one next to the small white connector (photo in [installation.md](https://github.com/chipster6502/MiSTer_monitor/blob/main/docs/installation.md#guition-jc8012p4a1c)). The other two power the board, but the flasher cannot reach it through them. Power it from a 5 V / 2 A supply: some MiSTer USB ports cannot feed a 10.1" panel with WiFi, and the board restarts as the WiFi comes up.
            - The other boards change only in their version number. Update the server as usual so both halves match, and run `MiSTer_Monitor` once from the Scripts menu afterwards; if the version panel turns red, one of the two did not update.

      - name: Build flasher site
        run: |
          mkdir -p site/flasher
          cp docs/flasher/index.html site/flasher/
          cp dist/*.bin site/flasher/
          cp docs/images/guition-usb-uart.jpg site/flasher/
          VER="${GITHUB_REF_NAME}"
          printf '{ "name": "MiSTer Monitor (CYD 2.8-inch ILI9341)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd_ili9341.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd-ili9341.json
          printf '{ "name": "MiSTer Monitor (CYD 2.8-inch ST7789)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd_st7789.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd-st7789.json
          printf '{ "name": "MiSTer Monitor (Tab5)", "version": "%s", "builds": [ { "chipFamily": "ESP32-P4", "parts": [ { "path": "mister_monitor_tab5.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-tab5.json
          printf '{ "name": "MiSTer Monitor (Guition 10.1-inch)", "version": "%s", "builds": [ { "chipFamily": "ESP32-P4", "parts": [ { "path": "mister_monitor_guition10inch.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-guition10inch.json
          printf '{ "name": "MiSTer Monitor (CYD 3.5-inch capacitive)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd35c.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd35c.json
          printf '{ "name": "MiSTer Monitor (CYD 3.5-inch resistive)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd35r.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd35r.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4