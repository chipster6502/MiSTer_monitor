name: Build and Release Firmware

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # required to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install cores
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json \
            https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli core install m5stack:esp32@3.3.7

      - name: Install libraries
        run: |
          arduino-cli lib install "M5Unified" "M5GFX" "JPEGDEC" "LovyanGFX" "XPT2046_Touchscreen"

      - name: Inject ScreenScraper credentials
        env:
          SS_DEV_ID:   ${{ secrets.SS_DEV_ID }}
          SS_DEV_PASS: ${{ secrets.SS_DEV_PASS }}
        run: |
          for d in mister_monitor_Tab5 mister_monitor_Guition10inch mister_monitor_CYD28R_ILI9341 mister_monitor_CYD28R_ST7789 mister_monitor_CYD35C mister_monitor_CYD35R; do
            printf '#pragma once\n#define SS_DEV_ID_EMBEDDED   "%s"\n#define SS_DEV_PASS_EMBEDDED "%s"\n' \
              "$SS_DEV_ID" "$SS_DEV_PASS" > "$d/ss_credentials.h"
          done

      - name: Compile Tab5
        run: |
          arduino-cli compile \
            --fqbn "m5stack:esp32:m5stack_tab5" \
            --output-dir build/tab5 \
            mister_monitor_Tab5

      - name: Compile Guition 10.1 inch
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32p4:PSRAM=enabled,FlashMode=qio,FlashFreq=80,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB" \
            --output-dir build/guition10inch \
            mister_monitor_Guition10inch

      - name: Compile CYD 2.8" ILI9341
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd_ili9341 \
            mister_monitor_CYD28R_ILI9341

      - name: Compile CYD 2.8" ST7789
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd_st7789 \
            mister_monitor_CYD28R_ST7789

      - name: Compile CYD35C
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd35c \
            mister_monitor_CYD35C

      - name: Compile CYD35R
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd35r \
            mister_monitor_CYD35R

      - name: Collect binaries
        run: |
          mkdir -p dist
          cp build/tab5/mister_monitor_Tab5.ino.merged.bin dist/mister_monitor_tab5.bin
          cp build/guition10inch/mister_monitor_Guition10inch.ino.merged.bin dist/mister_monitor_guition10inch.bin
          cp build/cyd_ili9341/mister_monitor_CYD28R_ILI9341.ino.merged.bin dist/mister_monitor_cyd_ili9341.bin
          cp build/cyd_st7789/mister_monitor_CYD28R_ST7789.ino.merged.bin dist/mister_monitor_cyd_st7789.bin
          cp build/cyd35c/mister_monitor_CYD35C.ino.merged.bin dist/mister_monitor_cyd35c.bin
          cp build/cyd35r/mister_monitor_CYD35R.ino.merged.bin dist/mister_monitor_cyd35r.bin

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          body: |
            ### New

            - **Standby mode, on all six boards.** Once the MiSTer has gone unanswered for `standby_offline_min` minutes (3 by default) the display dims to a standby screen, and it comes back on its own when the MiSTer answers again, when the core or game changes, or at a touch. `standby_screen=clock` shows a large seven-segment clock, the date, whether the MiSTer is online and the core and game it is running; `minimal` shows the MiSTer logo with a small dot labelled with the MiSTer state. On the Tab5 and the Guition the logo breathes; on the CYD boards the backlight does. `standby_idle_min` can also send the display to standby after a stretch with no core change, game change, achievement or touch. `standby_brightness` sets the backlight level, and `standby_dim` darkens the drawing itself for units whose backlight only switches on and off.
            - **A clock, set over the network.** Put one of the friendly names listed in `config.ini` in `timezone` (`spain`, `uk`, `useastern`, `japan`…) or a POSIX TZ string, and the display fetches the time from `ntp_server`; daylight saving changes are handled, and `clock_24h=false` switches to AM/PM. With `timezone` blank no time is fetched and standby stays on `minimal`.
            - **Kiosk mode.** `kiosk_mode=true` gives the whole panel to the artwork and hides the footer strip. A tap brings the strip up over the image for `kiosk_hide_delay_ms`, and a second tap works as usual. Available on all six boards.
            - **`image_mode`** chooses what the fullscreen view shows while a game is loaded: `rotate` alternates game and system artwork as before, `game` and `system` stay on one and never switch.
            - **`image_upscale`** grows artwork that is smaller than the display area until it fills it, aspect preserved, up to `image_upscale_max` (2.5 by default). Off by default, and most visible on the Tab5 and the Guition, whose panels are larger than the source art.
            - **System artwork follows `core_media_order`**, which gains two system-level tokens: `screenmarquee`, a marquee-style image that fills the frame and is now part of the default order, and `background`. For games, `titlescreen` asks for the title screen alone.
            - **Sound options on the Tab5.** `sound=false` silences the boot jingle and the touch beeps; `sound_volume` sets the speaker level.
            - **The second Guition panel revision is supported.** Guition ships the 10.1" board with two different LCD panels behind the same controller, and units from batch 2624 onward need `panel_rev=v2` in the `[ui]` section — without it they show horizontal colour banding instead of the interface. The batch is the figure in parentheses after the SKU on the back sticker: `101153001-V2 (2631)` is batch 2631, so `v2`.
            - **The Guition updates its WiFi coprocessor from the card.** Some units ship with ESP32-C6 firmware that lists your network at full strength and then never connects. With `c6_firmware.bin` from `SD_card_content/Guition/` in the root of the card, the display brings the coprocessor up to date at boot and restarts; the image goes to the spare slot first, so a power cut mid-write leaves the old firmware in place.
            - **Fourteen more cores are recognised by name**: Commodore CBM-II, Fujitsu FM-7, Tiger Game.com, TimeTop GameKing, National JR-100, Casio Loopy, NeXT Computer, Sony PocketStation, SGI Indy, RCA Studio II, Funtech Super A'Can, Luxor ABC 80, Amstrad PCW and Tamagotchi.

            ### Fixes

            - **`ip=` in `config.ini` now pins the display to that MiSTer** (#31). Discovery could adopt a different MiSTer answering on the same network; with `ip=` set the display follows that one and no other, even while it is powered off. With several MiSTers, set it on each display and give each MiSTer a fixed address.
            - **A running game is no longer cleared from the display mid-session** when the MiSTer is left pointing at the game's folder rather than at its file.
            - **The `screenshot` media token fetches an in-game screenshot**, falling back to the title screen. It used to ask for the title screen only.
            - **`MiSTer_Monitor` reads `log_file_entry` the way MiSTer does**: only keys under `[MiSTer]` count and the last one wins. It sets the value to 1 when the effective one is 0, and reports duplicates or keys left under the wrong section instead of trusting the first match.

            ### Notes

            - Every new key is optional. A `config.ini` from 2.10 keeps working and the defaults apply: standby after three minutes offline, on the `minimal` screen until a `timezone` is set. `standby_when_offline=false` turns it off. The new keys, with their comments, are in `SD_card_content/<board>/config.ini` and explained in [configuration.md](https://github.com/chipster6502/MiSTer_monitor/blob/main/docs/configuration.md); the quickest way to add them is `http://<display-ip>:8080/config`.
            - Copy `cores/logo_standby.565` from `SD_card_content/<board>/` to the `/cores/` folder of your card — `http://<display-ip>:8080/files` can upload it. It is the standby logo as raw pixels; without it the display falls back to a JPEG logo, which shows faint blotches in flat colours, or to plain text.
            - Kiosk mode requests artwork at the full panel height, so images already cached on the card show a black band until they are fetched again. Set `force_core_redownload` and `force_game_redownload` to `true` in `[images]` for one boot, then back to `false`.
            - The illustrated [setup guide PDF](https://github.com/chipster6502/MiSTer_monitor/blob/main/docs/MiSTer_Monitor_Setup_Guide.pdf) now closes with a reference of everything `config.ini` can do, grouped by what you want to achieve.
            - After the server updates, run `MiSTer_Monitor` once from the Scripts menu so the new version is the one running.
            - Update both halves as usual: firmware from the [web flasher](https://chipster6502.github.io/MiSTer_monitor/flasher/), server through *Update All* / MiSTer Companion / Downloader. If the version panel turns red afterwards, one of the two did not update.

      - name: Build flasher site
        run: |
          mkdir -p site/flasher
          cp docs/flasher/index.html site/flasher/
          cp dist/*.bin site/flasher/
          VER="${GITHUB_REF_NAME}"
          printf '{ "name": "MiSTer Monitor (CYD 2.8-inch ILI9341)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd_ili9341.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd-ili9341.json
          printf '{ "name": "MiSTer Monitor (CYD 2.8-inch ST7789)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd_st7789.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd-st7789.json
          printf '{ "name": "MiSTer Monitor (Tab5)", "version": "%s", "builds": [ { "chipFamily": "ESP32-P4", "parts": [ { "path": "mister_monitor_tab5.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-tab5.json
          printf '{ "name": "MiSTer Monitor (Guition 10.1-inch)", "version": "%s", "builds": [ { "chipFamily": "ESP32-P4", "parts": [ { "path": "mister_monitor_guition10inch.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-guition10inch.json
          printf '{ "name": "MiSTer Monitor (CYD 3.5-inch capacitive)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd35c.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd35c.json
          printf '{ "name": "MiSTer Monitor (CYD 3.5-inch resistive)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd35r.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd35r.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4