name: Build and Release Firmware

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # required to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install cores
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json \
            https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
          arduino-cli core install m5stack:esp32@3.3.7

      - name: Install libraries
        run: |
          arduino-cli lib install "M5Unified" "M5GFX" "JPEGDEC" "PNGdec" "LovyanGFX" "XPT2046_Touchscreen"

      - name: Inject ScreenScraper credentials
        env:
          SS_DEV_ID:   ${{ secrets.SS_DEV_ID }}
          SS_DEV_PASS: ${{ secrets.SS_DEV_PASS }}
        run: |
          for d in mister_monitor_Tab5 mister_monitor_Guition10inch mister_monitor_CYD28R_ILI9341 mister_monitor_CYD28R_ST7789 mister_monitor_CYD35C mister_monitor_CYD35R mister_monitor_Waveshare28; do
            printf '#pragma once\n#define SS_DEV_ID_EMBEDDED   "%s"\n#define SS_DEV_PASS_EMBEDDED "%s"\n' \
              "$SS_DEV_ID" "$SS_DEV_PASS" > "$d/ss_credentials.h"
          done

      - name: Compile Tab5
        run: |
          arduino-cli compile \
            --fqbn "m5stack:esp32:m5stack_tab5" \
            --output-dir build/tab5 \
            mister_monitor_Tab5

      - name: Compile Guition 10.1 inch
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32p4:ChipVariant=prev3,PSRAM=enabled,FlashMode=qio,FlashFreq=80,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB" \
            --output-dir build/guition10inch \
            mister_monitor_Guition10inch

      # ESP32-P4 v3.x silicon cannot run images built for earlier revisions
      # (and vice versa), so recent Guition units get their own build.
      - name: Compile Guition 10.1 inch (ESP32-P4 v3)
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32p4:ChipVariant=postv3,PSRAM=enabled,FlashMode=qio,FlashFreq=80,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB" \
            --output-dir build/guition10inch_v3 \
            mister_monitor_Guition10inch

      # min_spiffs gives the 4 MB boards two 1.875 MB app slots, which the
      # over-the-air updater needs. huge_app (one 3 MB slot) cannot take an
      # update; a board still on it is told to reflash once by cable.
      - name: Compile CYD 2.8" ILI9341
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=min_spiffs,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd_ili9341 \
            mister_monitor_CYD28R_ILI9341

      - name: Compile CYD 2.8" ST7789
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=min_spiffs,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd_st7789 \
            mister_monitor_CYD28R_ST7789

      - name: Compile CYD35C
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=min_spiffs,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd35c \
            mister_monitor_CYD35C

      - name: Compile CYD35R
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=min_spiffs,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd35r \
            mister_monitor_CYD35R

      # Two 3 MB app slots on the 16 MB flash; the sketch has to be built with
      # this scheme, because an over-the-air update cannot change the
      # partition table of a board that is already in the field.
      - name: Compile Waveshare 2.8
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,PSRAM=opi,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB" \
            --output-dir build/waveshare28 \
            mister_monitor_Waveshare28

      - name: Collect binaries
        run: |
          mkdir -p dist
          cp build/tab5/mister_monitor_Tab5.ino.merged.bin dist/mister_monitor_tab5.bin
          cp build/guition10inch/mister_monitor_Guition10inch.ino.merged.bin dist/mister_monitor_guition10inch.bin
          cp build/guition10inch_v3/mister_monitor_Guition10inch.ino.merged.bin dist/mister_monitor_guition10inch_v3.bin
          cp build/cyd_ili9341/mister_monitor_CYD28R_ILI9341.ino.merged.bin dist/mister_monitor_cyd_ili9341.bin
          cp build/cyd_st7789/mister_monitor_CYD28R_ST7789.ino.merged.bin dist/mister_monitor_cyd_st7789.bin
          cp build/cyd35c/mister_monitor_CYD35C.ino.merged.bin dist/mister_monitor_cyd35c.bin
          cp build/cyd35r/mister_monitor_CYD35R.ino.merged.bin dist/mister_monitor_cyd35r.bin
          cp build/waveshare28/mister_monitor_Waveshare28.ino.merged.bin dist/mister_monitor_waveshare28.bin

      # The app-only images are what the displays fetch over the air. They go
      # to the Downloader DB next to the server, with a manifest the display
      # uses to pick its build and verify the download.
      - name: Collect OTA images and write the manifest
        run: |
          mkdir -p dist/ota
          cp build/tab5/mister_monitor_Tab5.ino.bin                      dist/ota/tab5.bin
          cp build/guition10inch/mister_monitor_Guition10inch.ino.bin    dist/ota/guition10inch.bin
          cp build/guition10inch_v3/mister_monitor_Guition10inch.ino.bin dist/ota/guition10inch_v3.bin
          cp build/cyd_ili9341/mister_monitor_CYD28R_ILI9341.ino.bin     dist/ota/cyd_ili9341.bin
          cp build/cyd_st7789/mister_monitor_CYD28R_ST7789.ino.bin       dist/ota/cyd_st7789.bin
          cp build/cyd35c/mister_monitor_CYD35C.ino.bin                  dist/ota/cyd35c.bin
          cp build/cyd35r/mister_monitor_CYD35R.ino.bin                  dist/ota/cyd35r.bin
          cp build/waveshare28/mister_monitor_Waveshare28.ino.bin        dist/ota/waveshare28.bin
          python3 - <<'EOF'
          import hashlib, json, os
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          boards = {}
          for name in sorted(os.listdir("dist/ota")):
              if not name.endswith(".bin"):
                  continue
              data = open(os.path.join("dist/ota", name), "rb").read()
              # An ESP app image starts with 0xE9; the merged flasher image
              # does not. Never let the wrong one reach the displays.
              assert data[:1] == b"\xe9", f"{name} is not an app image"
              boards[name[:-4]] = {"file": name, "size": len(data),
                                   "md5": hashlib.md5(data).hexdigest()}
          with open("dist/ota/manifest.json", "w") as f:
              json.dump({"version": version, "boards": boards}, f, indent=2)
          print(open("dist/ota/manifest.json").read())
          EOF

      - name: Checkout the DB repo
        uses: actions/checkout@v4
        with:
          repository: chipster6502/MiSTer_monitor_DB
          ref: main
          token: ${{ secrets.DB_PUSH_TOKEN }}
          path: db

      - name: Publish the OTA images to the DB repo
        working-directory: db
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FW=Scripts/.config/mister_monitor/firmware
          rm -rf "$FW" && mkdir -p "$FW"
          cp ../dist/ota/* "$FW/"
          git add -A "$FW"
          if git diff --cached --quiet; then
            echo "DB repo already carries these images — nothing to publish."
            exit 0
          fi
          git commit -m "firmware: OTA images from ${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}"
          # sync-to-db.yml pushes the server files to the same branch on the
          # same tag; whichever lands second rebases onto the other.
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          body: |
            ### New

            - **Firmware updates over WiFi, served by the MiSTer.** Every release now ships the display firmware through the Downloader, next to the server, so the MiSTer always holds the build that matches it. When the display sees a newer version for its board it shows `UPDATE TO x.y.z — TAP TO INSTALL` for a few seconds: tap it, and the display downloads the image, shows the progress and restarts by itself. If the banner passes, the version panel on the main screen stays orange; tap the main screen to bring the banner back. `ota_auto=true` in the new `[update]` section installs without a tap, and `http://<display-ip>:8080/update` offers the same from a browser and can install a `.bin` from your computer as well. The image goes to the spare app slot and is verified before the display switches to it, so a download that stops halfway or arrives damaged never starts and the running version stays in place. On all seven boards.
            - **Screenshots and title screens from the artwork packs.** The [MiSTer Artwork Pack](https://github.com/chipster6502/MiSTer_artwork_pack) now has a *Screenshots* and a *Title Screens* pack for its 39 systems, and the display uses them wherever `screenshot` or `titlescreen` comes up in `game_media_order` or `arcade_media_order`. The packs on the MiSTer are walked in that order before any ScreenScraper request, so with the default order a game the Box Art pack does not cover shows its pack screenshot at once.
            - **Screenshots are drawn pixel for pixel.** Screenshots and title screens, from the packs or from ScreenScraper, now reach the display as they are stored, almost always a PNG at its native size, instead of a resized JPEG, so pixel art keeps its edges. `screenshot_scaling` in `[images]` chooses how they fill the display area: `fill`, the default, always fills it with a sharp scale; `integer` grows them only by whole multiples, every pixel square. Box art is not affected.
            - **`image_mode=cycle`** stays on the game and alternates its screenshot, title screen and box every `core_image_timeout`, all three from the packs on the MiSTer; kinds a pack does not have are skipped. By Rick van Soest.
            - **The Waveshare ESP32-S3-Touch-LCD-2.8 V2 is supported, as a beta.** A seventh board, ported by Rick van Soest: an ESP32-S3 with a 2.8-inch 320x240 panel and capacitive touch. It is in the [web flasher](https://chipster6502.github.io/MiSTer_monitor/flasher/) with the others and its card content is in `SD_card_content/Waveshare28/`. The port was built inside a Mac Clock case and brings two options of its own: `art_inset_left` keeps the artwork clear of a case window that is not centred on the panel, and `idle_clock=true` turns the time the MiSTer sits in its menu into a desk clock that shows the time, the year and a smiling face in turn, with the outside temperature and the date.
            - **A settings page for `config.ini`.** `settings.html`, by Rick van Soest, is a graphical editor for the same file: switches, sliders, drop-downs and drag-to-reorder for the media orders, grouped in tabs, each field with its notes from `config.ini`. It rewrites only the values you change, leaving comments, key order and line endings as they are, keeps `config.ini.bak`, and can reboot the display once saved. It is a file on the card: follow the *Settings page* link on `/config`.
            - **Outside temperature on the standby clock.** Set `weather_city`, or `weather_lat` and `weather_lon`, in the new `[weather]` section and the `clock` standby screen shows the temperature after the date, in °C or °F (`weather_unit`). It comes from [Open-Meteo](https://open-meteo.com), which is free and needs no account or key, and it is fetched only while the display is in standby.
            - **Standby while the MiSTer sits in its menu.** `standby_in_menu=true` sends the display to standby whenever the MiSTer is switched on with no core loaded, at once or after `standby_menu_delay` seconds. Loading a core wakes it; a tap wakes it for half a minute.
            - **3.5" boards whose touch lands mirrored can now be fixed from config.ini.** New `[ui]` options `touch_invert_x` and `touch_invert_y` mirror a touch axis without changing the image, and work together with `flip_display`. Resistive clones such as the LCDwiki E32R35T need `touch_invert_y=true`. Thanks to @so1omon563 (#34) for reporting it and testing the fix.
            - **Cached game images follow your settings.** Each game now keeps its box, its screenshot and its title screen as separate files on the card. Change `game_media_order` or `arcade_media_order`, or install or update a pack, and the image is looked up again by itself the next time the game loads, with no need for `force_game_redownload`. Images cached by earlier versions keep working.

            ### Fixes

            - **Saving from `/config` no longer cuts a long `config.ini` short.** On the boards without PSRAM, the CYD family, the display could run out of memory while decoding the form and lose the end of the file without a warning. Saves are now written to the card as they arrive.
            - **A game loaded from the OSD is no longer taken for Super Attract Mode.** On a MiSTer that boots straight into a core, the server could believe SAM was running when it had never started; the game was not identified and the display kept the default image. By Rick van Soest.
            - **CYD boards: the screen comes back after standby.** On units where fine backlight control is not available, leaving standby could leave the backlight off. By Rick van Soest.
            - **The pack image is ready the moment a new game is announced.** The display could ask for it a few hundred milliseconds too soon, be told there was none, and settle for an image from further down its media order.

            ### Notes

            - **This update still needs the cable, for the last time.** 2.11.1 and earlier cannot update themselves, so flash 2.12.0 once from the [web flasher](https://chipster6502.github.io/MiSTer_monitor/flasher/); your card and settings stay as they are. From then on new versions arrive over WiFi. On the four CYD boards this flash also moves the board to a partition layout with two app slots, which is what an over-the-air update needs. If you build the CYD firmware yourself, change the Partition Scheme from `Huge APP` to `Minimal SPIFFS (1.9MB APP with OTA/128KB SPIFFS)`: a board left on the old layout is told to reflash instead of being offered an update.
            - **Guition units with the ESP32-P4 v3 chip** still cannot be reached by the web flasher, so this one flash goes through [esptool-js](https://espressif.github.io/esptool-js/) or esptool as before, with `mister_monitor_guition10inch_v3.bin` at address `0x0`. After that they are offered their own image over WiFi, like the other boards.
            - **Update the MiSTer as well, and restart the server.** Run *Update All*, MiSTer Companion or the Downloader, then `MiSTer_Monitor` once from the Scripts menu so the new server is the one running. It is the server that hands future firmware to the display. If the version panel turns red afterwards, one of the two halves did not update.
            - **Every new key is optional.** A `config.ini` from 2.11 keeps working and the defaults apply. The new keys, with their comments, are in `SD_card_content/<board>/config.ini` and explained in [configuration.md](https://github.com/chipster6502/MiSTer_monitor/blob/main/docs/configuration.md). Copy `settings.html` from the same folder to the root of your card — `http://<display-ip>:8080/files` can upload it — and the settings page adds a missing key to your file when you set it.
            - **The Screenshots and Title Screens packs** are in *Update All* under **Extra Content → Game Artwork DBs**, next to Box Art, and each installs on its own.
            - The illustrated setup guide has a new look, a section on updates over WiFi, and two versions with the same content: [for the screen](https://github.com/chipster6502/MiSTer_monitor/blob/main/docs/MiSTer_Monitor_Setup_Guide.pdf) and [for printing](https://github.com/chipster6502/MiSTer_monitor/blob/main/docs/MiSTer_Monitor_Setup_Guide_print.pdf).
            - The web flasher page now counts visits, flashes and firmware downloads per board with [GoatCounter](https://www.goatcounter.com/), anonymously and without cookies, to learn which boards are in use.

      - name: Build flasher site
        run: |
          mkdir -p site/flasher
          cp docs/flasher/index.html site/flasher/
          cp dist/*.bin site/flasher/
          cp docs/images/guition-usb-uart.jpg site/flasher/
          VER="${GITHUB_REF_NAME}"
          printf '{ "name": "MiSTer Monitor (CYD 2.8-inch ILI9341)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd_ili9341.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd-ili9341.json
          printf '{ "name": "MiSTer Monitor (CYD 2.8-inch ST7789)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd_st7789.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd-st7789.json
          printf '{ "name": "MiSTer Monitor (Tab5)", "version": "%s", "builds": [ { "chipFamily": "ESP32-P4", "parts": [ { "path": "mister_monitor_tab5.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-tab5.json
          printf '{ "name": "MiSTer Monitor (Guition 10.1-inch)", "version": "%s", "builds": [ { "chipFamily": "ESP32-P4", "parts": [ { "path": "mister_monitor_guition10inch.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-guition10inch.json
          printf '{ "name": "MiSTer Monitor (CYD 3.5-inch capacitive)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd35c.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd35c.json
          printf '{ "name": "MiSTer Monitor (CYD 3.5-inch resistive)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd35r.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd35r.json
          printf '{ "name": "MiSTer Monitor (Waveshare 2.8-inch)", "version": "%s", "builds": [ { "chipFamily": "ESP32-S3", "parts": [ { "path": "mister_monitor_waveshare28.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-waveshare28.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4