name: Build and Release Firmware

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # required to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install cores
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json \
            https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli core install m5stack:esp32@3.3.7

      - name: Install libraries
        run: |
          arduino-cli lib install "M5Unified" "M5GFX" "JPEGDEC" "LovyanGFX" "XPT2046_Touchscreen"

      - name: Inject ScreenScraper credentials
        env:
          SS_DEV_ID:   ${{ secrets.SS_DEV_ID }}
          SS_DEV_PASS: ${{ secrets.SS_DEV_PASS }}
        run: |
          for d in mister_monitor_Tab5 mister_monitor_CYD28R_ILI9341 mister_monitor_CYD28R_ST7789 mister_monitor_CYD35C mister_monitor_CYD35R; do
            printf '#pragma once\n#define SS_DEV_ID_EMBEDDED   "%s"\n#define SS_DEV_PASS_EMBEDDED "%s"\n' \
              "$SS_DEV_ID" "$SS_DEV_PASS" > "$d/ss_credentials.h"
          done

      - name: Compile Tab5
        run: |
          arduino-cli compile \
            --fqbn "m5stack:esp32:m5stack_tab5" \
            --output-dir build/tab5 \
            mister_monitor_Tab5

      - name: Compile CYD 2.8" ILI9341
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd_ili9341 \
            mister_monitor_CYD28R_ILI9341

      - name: Compile CYD 2.8" ST7789
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd_st7789 \
            mister_monitor_CYD28R_ST7789

      - name: Compile CYD35C
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd35c \
            mister_monitor_CYD35C

      - name: Compile CYD35R
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd35r \
            mister_monitor_CYD35R

      - name: Collect binaries
        run: |
          mkdir -p dist
          cp build/tab5/mister_monitor_Tab5.ino.merged.bin dist/mister_monitor_tab5.bin
          cp build/cyd_ili9341/mister_monitor_CYD28R_ILI9341.ino.merged.bin dist/mister_monitor_cyd_ili9341.bin
          cp build/cyd_st7789/mister_monitor_CYD28R_ST7789.ino.merged.bin dist/mister_monitor_cyd_st7789.bin
          cp build/cyd35c/mister_monitor_CYD35C.ino.merged.bin dist/mister_monitor_cyd35c.bin
          cp build/cyd35r/mister_monitor_CYD35R.ino.merged.bin dist/mister_monitor_cyd35r.bin

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          body: |
            ### New

            - **Artwork packs, installed from Update All.** *Update All 2.10* ships the [MiSTer Artwork Pack](https://github.com/chipster6502/MiSTer_artwork_pack): 39 systems and 23,658 images in your choice of 2D boxes, 3D boxes or box + screenshot, enabled under *Settings → Extra Content → Game Artwork DBs*. The server serves the pack image for the loaded game and the display shows it without a round trip to ScreenScraper, so covered games appear at once and ScreenScraper is left for cores and for the games the pack lacks.
            - **Shared catalogues.** Game Boy and Game Boy Color fall back to each other's folder and the Super Game Boy core borrows both; Famicom Disk System and Satellaview, which the NES and SNES cores load as their own, resolve to their own pack folders and fall back to the cartridge system's when ScreenScraper filed a title there.
            - **FDS and Satellaview are their own systems on ScreenScraper too.** A `.fds`/`.qd` image through the NES core is queried as Famicom Disk System and a `.bs` broadcast through the SNES core as Satellaview, each with its own art, instead of as a cartridge whose CRC ScreenScraper does not know.
            - **MiSTer Monitor is now fully compatible with Zaparoo Frontend.** Games launched from it are identified and get their artwork like an OSD launch.

            ### Fixes

            - **Neo Geo pack folder** is `NEOGEO`, as the Downloader writes it on the card; the mixed-case name resolved nothing.
            - **Game names with a slash** — the Neo Geo core reports titles such as `Metal Slug 2: Super Vehicle-001/II` from its `romsets.xml` — no longer lose everything before the slash when the pack key is built.
            - **ScreenScraper's own `ss` region** is tried after the geographic ones and before the unsuffixed generic. A box uploaded with no region set is often the only one a title has, and no regional preference could reach it before.
            - **A stale `FILESELECT=selected` no longer overrides a fresh launch**: it only names the running game when `CURRENTPATH` was written alongside it.
            - **Satellaview** is hashed as SNES for RetroAchievements.

            ### Notes

            - The packs are optional. Without them nothing changes: artwork keeps coming from ScreenScraper as before. Core images and any game the pack does not cover still come from ScreenScraper, so the account is still needed.
            - MiSTer Monitor itself is now listed in *Update All 2.10* under *Settings → Tools & Scripts*.
            - Update both halves as usual: firmware from the web flasher, server through *Update All* / MiSTer Companion / Downloader. If the version panel turns red afterwards, one of the two did not update.

      - name: Build flasher site
        run: |
          mkdir -p site/flasher
          cp docs/flasher/index.html site/flasher/
          cp dist/*.bin site/flasher/
          VER="${GITHUB_REF_NAME}"
          printf '{ "name": "MiSTer Monitor (CYD 2.8-inch ILI9341)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd_ili9341.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd-ili9341.json
          printf '{ "name": "MiSTer Monitor (CYD 2.8-inch ST7789)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd_st7789.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd-st7789.json
          printf '{ "name": "MiSTer Monitor (Tab5)", "version": "%s", "builds": [ { "chipFamily": "ESP32-P4", "parts": [ { "path": "mister_monitor_tab5.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-tab5.json
          printf '{ "name": "MiSTer Monitor (CYD 3.5-inch capacitive)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd35c.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd35c.json
          printf '{ "name": "MiSTer Monitor (CYD 3.5-inch resistive)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd35r.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd35r.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4