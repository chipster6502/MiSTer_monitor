name: Build and Release Firmware

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # required to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install cores
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json \
            https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli core install m5stack:esp32@3.3.7

      - name: Install libraries
        run: |
          arduino-cli lib install "M5Unified" "M5GFX" "JPEGDEC" "LovyanGFX" "XPT2046_Touchscreen"

      - name: Inject ScreenScraper credentials
        env:
          SS_DEV_ID:   ${{ secrets.SS_DEV_ID }}
          SS_DEV_PASS: ${{ secrets.SS_DEV_PASS }}
        run: |
          for d in mister_monitor_Tab5 mister_monitor_Guition10inch mister_monitor_CYD28R_ILI9341 mister_monitor_CYD28R_ST7789 mister_monitor_CYD35C mister_monitor_CYD35R; do
            printf '#pragma once\n#define SS_DEV_ID_EMBEDDED   "%s"\n#define SS_DEV_PASS_EMBEDDED "%s"\n' \
              "$SS_DEV_ID" "$SS_DEV_PASS" > "$d/ss_credentials.h"
          done

      - name: Compile Tab5
        run: |
          arduino-cli compile \
            --fqbn "m5stack:esp32:m5stack_tab5" \
            --output-dir build/tab5 \
            mister_monitor_Tab5

      - name: Compile Guition 10.1 inch
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32p4:PSRAM=enabled,FlashMode=qio,FlashFreq=80,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB" \
            --output-dir build/guition10inch \
            mister_monitor_Guition10inch

      - name: Compile CYD 2.8" ILI9341
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd_ili9341 \
            mister_monitor_CYD28R_ILI9341

      - name: Compile CYD 2.8" ST7789
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd_st7789 \
            mister_monitor_CYD28R_ST7789

      - name: Compile CYD35C
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd35c \
            mister_monitor_CYD35C

      - name: Compile CYD35R
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd35r \
            mister_monitor_CYD35R

      - name: Collect binaries
        run: |
          mkdir -p dist
          cp build/tab5/mister_monitor_Tab5.ino.merged.bin dist/mister_monitor_tab5.bin
          cp build/guition10inch/mister_monitor_Guition10inch.ino.merged.bin dist/mister_monitor_guition10inch.bin
          cp build/cyd_ili9341/mister_monitor_CYD28R_ILI9341.ino.merged.bin dist/mister_monitor_cyd_ili9341.bin
          cp build/cyd_st7789/mister_monitor_CYD28R_ST7789.ino.merged.bin dist/mister_monitor_cyd_st7789.bin
          cp build/cyd35c/mister_monitor_CYD35C.ino.merged.bin dist/mister_monitor_cyd35c.bin
          cp build/cyd35r/mister_monitor_CYD35R.ino.merged.bin dist/mister_monitor_cyd35r.bin

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          body: |
            ### New

            - **The Guition JC8012P4A1C 10.1" is supported.** A sixth board joins the list: an ESP32-P4 with a 10.1-inch MIPI-DSI panel and capacitive touch, drawn at 1280x720 in landscape. Prebuilt firmware is in the [web flasher](https://chipster6502.github.io/MiSTer_monitor/flasher/) alongside the others, and its card layout ships in `SD_card_content/Guition/`.
            - **A web interface on the display itself, on port 8080.** `http://<display-ip>:8080/config` opens `config.ini` in a browser text editor — comments and all — and offers a Reboot button to apply the changes; the previous file is kept on the card as `config.ini.bak`. `http://<display-ip>:8080/files` browses the microSD card: open folders, preview or download a file, upload new ones, create folders, and delete what you no longer need. The most common use is artwork — delete a game's image to have it fetched again, or upload your own instead. Available on all six boards. The display's own address is on the boot screen and on the Network page, listed as *Monitor IP*.
            - **`system_image_timeout`** gives the system image slide its own dwell time, independent of `core_image_timeout`. Leave it at `0` to keep them the same.
            - **Games launched with only a core name behind them** are identified by reading the scratch `.mgl` the launcher leaves, so they get their artwork like an OSD launch.

            ### Fixes

            - **Artwork no longer redraws when nothing has changed** — `core_image_timeout` was repainting the same image on every cycle.
            - **Large artwork loads on the Guition**: big JPEG frames were allocated from internal SRAM instead of PSRAM, and failed once the network stack was up.
            - **Neo Geo titles** resolve through `romsets.xml` when the launcher leaves the romset id instead of a file path.

            ### Notes

            - The web interface is plain HTTP on your LAN, with no password by default. The editor shows `config.ini` exactly as written, so anyone who can reach the page can read your WiFi and ScreenScraper passwords. Set `web_password` in the `[ui]` section to require one, or `web_config=false` to switch the interface off; both keys are documented in `config.ini` and in [configuration.md](https://github.com/chipster6502/MiSTer_monitor/blob/main/docs/configuration.md).
            - The first `[wifi]` edit still has to happen on a computer — the display has to be on the network before its web interface can be reached.
            - An illustrated [setup guide PDF](https://github.com/chipster6502/MiSTer_monitor/blob/main/docs/MiSTer_Monitor_Setup_Guide.pdf) walks through the whole installation in six numbered steps.
            - Update both halves as usual: firmware from the web flasher, server through *Update All* / MiSTer Companion / Downloader. If the version panel turns red afterwards, one of the two did not update.

      - name: Build flasher site
        run: |
          mkdir -p site/flasher
          cp docs/flasher/index.html site/flasher/
          cp dist/*.bin site/flasher/
          VER="${GITHUB_REF_NAME}"
          printf '{ "name": "MiSTer Monitor (CYD 2.8-inch ILI9341)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd_ili9341.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd-ili9341.json
          printf '{ "name": "MiSTer Monitor (CYD 2.8-inch ST7789)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd_st7789.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd-st7789.json
          printf '{ "name": "MiSTer Monitor (Tab5)", "version": "%s", "builds": [ { "chipFamily": "ESP32-P4", "parts": [ { "path": "mister_monitor_tab5.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-tab5.json
          printf '{ "name": "MiSTer Monitor (Guition 10.1-inch)", "version": "%s", "builds": [ { "chipFamily": "ESP32-P4", "parts": [ { "path": "mister_monitor_guition10inch.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-guition10inch.json
          printf '{ "name": "MiSTer Monitor (CYD 3.5-inch capacitive)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd35c.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd35c.json
          printf '{ "name": "MiSTer Monitor (CYD 3.5-inch resistive)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd35r.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd35r.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4