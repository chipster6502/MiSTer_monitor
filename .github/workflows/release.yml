name: Build and Release Firmware

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # required to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install cores
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json \
            https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli core install m5stack:esp32@3.3.7

      - name: Install libraries
        run: |
          arduino-cli lib install "M5Unified" "M5GFX" "JPEGDEC" "LovyanGFX" "XPT2046_Touchscreen"

      - name: Inject ScreenScraper credentials
        env:
          SS_DEV_ID:   ${{ secrets.SS_DEV_ID }}
          SS_DEV_PASS: ${{ secrets.SS_DEV_PASS }}
        run: |
          for d in mister_monitor_Tab5 mister_monitor_CYD28R_ILI9341 mister_monitor_CYD28R_ST7789 mister_monitor_CYD35C mister_monitor_CYD35R; do
            printf '#pragma once\n#define SS_DEV_ID_EMBEDDED   "%s"\n#define SS_DEV_PASS_EMBEDDED "%s"\n' \
              "$SS_DEV_ID" "$SS_DEV_PASS" > "$d/ss_credentials.h"
          done

      - name: Compile Tab5
        run: |
          arduino-cli compile \
            --fqbn "m5stack:esp32:m5stack_tab5" \
            --output-dir build/tab5 \
            mister_monitor_Tab5

      - name: Compile CYD 2.8" ILI9341
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd_ili9341 \
            mister_monitor_CYD28R_ILI9341

      - name: Compile CYD 2.8" ST7789
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd_st7789 \
            mister_monitor_CYD28R_ST7789

      - name: Compile CYD35C
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd35c \
            mister_monitor_CYD35C

      - name: Compile CYD35R
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd35r \
            mister_monitor_CYD35R

      - name: Collect binaries
        run: |
          mkdir -p dist
          cp build/tab5/mister_monitor_Tab5.ino.merged.bin dist/mister_monitor_tab5.bin
          cp build/cyd_ili9341/mister_monitor_CYD28R_ILI9341.ino.merged.bin dist/mister_monitor_cyd_ili9341.bin
          cp build/cyd_st7789/mister_monitor_CYD28R_ST7789.ino.merged.bin dist/mister_monitor_cyd_st7789.bin
          cp build/cyd35c/mister_monitor_CYD35C.ino.merged.bin dist/mister_monitor_cyd35c.bin
          cp build/cyd35r/mister_monitor_CYD35R.ino.merged.bin dist/mister_monitor_cyd35r.bin

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          body: |
            ## What's new in v2.7.0

            **RetroAchievements on the display**, and the release that made
            artwork detection stop guessing: Neo Geo romsets, cores running
            another system's games, DOS containers and name-only entries all
            resolve now, and core coverage audits itself weekly instead of
            being a hand-kept list. 102 commits since v2.6.0. Drop-in update —
            existing `config.ini` files keep working.

            ---

            ### RetroAchievements

            A dedicated page on all five boards, and a server layer that
            resolves the running game against RetroAchievements.

            - **Progress panel** — points, unlocked count and hardcore breakdown for the game you are playing.
            - **Trophy list** — every achievement in the set, paginated; tap any row for its full description.
            - **Unlock popups** — an achievement pops on screen the moment it triggers, over fullscreen artwork included, with title, description and points.
            - **READY FOR RETROACHIEVEMENTS banner** when a matched game loads on a core that can actually record unlocks.
            - **Honest states.** The page distinguishes *not configured*, *core not supported*, *game not matched*, **SET NOT PUBLISHED YET** (the game resolved but has no achievement set), **view-only** (a stock MiSTer shows your cloud progress but records nothing), and *the fork has a different game loaded* — instead of implying progress that cannot be banked.
            - **Setup is two lines.** The server writes an editable `ra_credentials.ini` on first start; fill in your RA username and Web API key. An existing file is never overwritten by updates.
            - **Three optional tiers, each degrading to the one below**: credentials only (view-only) → the [odelot/Main_MiSTer](https://github.com/odelot/Main_MiSTer) fork on `RA_` cores (unlocks are earned and recorded) → the fork with `debug=1` in `retroachievements.cfg` (popups in under a second, and PlayStation, Saturn and Mega CD resolve too).
            - Neo Geo games resolve through arcade romset-name hashing.
            - New endpoint: `/status/retroachievements`.

            ### Artwork and game detection

            - **Neo Geo (Darksoft)** — romset ZIPs and unzipped romset folders are recognised as the game itself, and bare-romset `.neo` files resolve their title.
            - **Neo Geo CD** — one core serves two consoles, and a disc image is now read as the CD console rather than as a cartridge: the panel names it Neo-Geo CD, artwork is fetched from ScreenScraper's Neo Geo CD platform (retrying as Neo Geo for the many CD releases whose cartridge entry is the one that exists), and it caches in its own folder. Loading a disc by hand now behaves exactly as a SAM rotation already did.
            - **Backwards-compatible cores** — an Atari 2600 cartridge in the 7800 core, Apple II disks on the IIgs, or a `.sms` through Genesis now get the artwork and achievements of the system the *game* belongs to, not the core running it. Console (autoboot) boot ROMs are presented as core-only.
            - **DOS and 0MHz containers** — container images are shown as core-only instead of chasing a game that isn't there; variant markers and disc numbers are stripped from name searches; CHD hashing is skipped on ao486.
            - **Name-only games** — entries with a name but no ROM on disk are detected as such, searched by name, and the verdict is shown rather than left spinning.
            - **New systems mapped** — Apple IIgs, AmigaVision Amiga variants, Atari Lynx 2P, Tomy Tutor, Elektronika BK0011M, Jupiter Ace, Tamagotchi, Paprium, Mega Drive VGM Player, and the unofficial z386 core.

            ### Core coverage that maintains itself

            - Official cores are mapped from **their own CONF_STR** instead of a hand-written table.
            - Unrecognised CORENAMEs are recorded and exposed at **`/status/unknown_cores`**, resolved through the same chain the HUD uses so the log and the screen can never disagree.
            - A **weekly job** audits MiSTer cores, watches GitHub for unofficial ones and opens a pull request proposing mappings.
            - CI **validates `CORE_NAME_MAPPING`** imports and parses on every PR.

            ### Game Info

            - **`info_in_rotation`** — new `config.ini` key that adds the fields panel to the automatic artwork cycle.
            - The panel no longer lingers after you leave it, the rotation clock restarts correctly, and it hides itself when ScreenScraper has confirmed there is nothing to show.
            - Tab5 honours the sidecar language stamp and re-fetches when the preferred language changes; the synopsis scroll keys are wired there too.

            ### Display and interface

            - **New artwork assets** — redesigned gradient menu art and new generic arcade art for all three board families, in `SD_card_content/`.
            - **CYD 2.8"** — achievement detail text at 1.5x, and trophy rows raised off the footer with the touch bands recalibrated to match.
            - **Tab5** — the footer game name no longer paints over the fullscreen navigation strip, and an expected JPEG clip warning at the footer band is silenced.
            - Core and game names with accents or non-Latin characters are folded to ASCII instead of rendering as garbage on the GLCD font.

            ### Under the hood

            - **Server robustness** — UTF-8 output end to end, refined SAM handling (evaluated before the OSD guard, freshness checks, name-only guards), case-insensitive `names.txt` merge, an ACTIVEGAME gate and a safety poll.
            - The ecosystem observatory and the unofficial-cores pipeline moved to their own repositories, [MiSTer_ecosystem](https://github.com/chipster6502/MiSTer_ecosystem) and [MiSTer_unofficial_cores](https://github.com/chipster6502/MiSTer_unofficial_cores), keeping this one focused on the monitor.

            ### Notes

            - **License change** — from this release the firmware is GPL-3.0-or-later and the server AGPL-3.0-or-later, with SPDX headers on every source file. Releases up to and including v2.6.0 remain MIT. A `TRADEMARK.md` now covers the project name.
            - **New artwork needs a copy.** The redesigned menu and arcade images live in `SD_card_content/`; an existing microSD card keeps the old ones until you copy the new files over.
            - **Sketch rename** — the 2.8" sketches are now named by panel controller (`CYD28R_ILI9341`, `CYD28R_ST7789`) instead of USB port count. Web flasher users are unaffected; anyone building from source needs to update their paths.
            - RetroAchievements is entirely optional: without `ra_credentials.ini` everything else behaves exactly as in v2.6.0.
            - Existing `config.ini` files work unchanged; new keys use sensible defaults.
      - name: Build flasher site
        run: |
          mkdir -p site/flasher
          cp docs/flasher/index.html site/flasher/
          cp dist/*.bin site/flasher/
          VER="${GITHUB_REF_NAME}"
          printf '{ "name": "MiSTer Monitor (CYD 2.8-inch ILI9341)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd_ili9341.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd-ili9341.json
          printf '{ "name": "MiSTer Monitor (CYD 2.8-inch ST7789)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd_st7789.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd-st7789.json
          printf '{ "name": "MiSTer Monitor (Tab5)", "version": "%s", "builds": [ { "chipFamily": "ESP32-P4", "parts": [ { "path": "mister_monitor_tab5.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-tab5.json
          printf '{ "name": "MiSTer Monitor (CYD 3.5-inch capacitive)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd35c.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd35c.json
          printf '{ "name": "MiSTer Monitor (CYD 3.5-inch resistive)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd35r.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd35r.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4