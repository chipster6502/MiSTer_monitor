name: Build and Release Firmware

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # required to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install cores
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json \
            https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli core install m5stack:esp32@3.3.7

      - name: Install libraries
        run: |
          arduino-cli lib install "M5Unified" "M5GFX" "JPEGDEC" "LovyanGFX" "XPT2046_Touchscreen"

      - name: Inject ScreenScraper credentials
        env:
          SS_DEV_ID:   ${{ secrets.SS_DEV_ID }}
          SS_DEV_PASS: ${{ secrets.SS_DEV_PASS }}
        run: |
          for d in mister_monitor_Tab5 mister_monitor_CYD28R_ILI9341 mister_monitor_CYD28R_ST7789 mister_monitor_CYD35C mister_monitor_CYD35R; do
            printf '#pragma once\n#define SS_DEV_ID_EMBEDDED   "%s"\n#define SS_DEV_PASS_EMBEDDED "%s"\n' \
              "$SS_DEV_ID" "$SS_DEV_PASS" > "$d/ss_credentials.h"
          done

      - name: Compile Tab5
        run: |
          arduino-cli compile \
            --fqbn "m5stack:esp32:m5stack_tab5" \
            --output-dir build/tab5 \
            mister_monitor_Tab5

      - name: Compile CYD 2.8" ILI9341
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd_ili9341 \
            mister_monitor_CYD28R_ILI9341

      - name: Compile CYD 2.8" ST7789
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd_st7789 \
            mister_monitor_CYD28R_ST7789

      - name: Compile CYD35C
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd35c \
            mister_monitor_CYD35C

      - name: Compile CYD35R
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32:PartitionScheme=huge_app,FlashSize=4M,PSRAM=disabled" \
            --output-dir build/cyd35r \
            mister_monitor_CYD35R

      - name: Collect binaries
        run: |
          mkdir -p dist
          cp build/tab5/mister_monitor_Tab5.ino.merged.bin dist/mister_monitor_tab5.bin
          cp build/cyd_ili9341/mister_monitor_CYD28R_ILI9341.ino.merged.bin dist/mister_monitor_cyd_ili9341.bin
          cp build/cyd_st7789/mister_monitor_CYD28R_ST7789.ino.merged.bin dist/mister_monitor_cyd_st7789.bin
          cp build/cyd35c/mister_monitor_CYD35C.ino.merged.bin dist/mister_monitor_cyd35c.bin
          cp build/cyd35r/mister_monitor_CYD35R.ino.merged.bin dist/mister_monitor_cyd35r.bin

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          body: |
            ### New

            - **Setup and launcher merged.** `MiSTer_Monitor_setup` and `start_monitor` are now a single **`MiSTer_Monitor`** entry in the Scripts menu: run it to configure auto-start and restart the server. It no longer needs the executable bit, so a copy made over the network works too. Existing installs keep running untouched and migrate the first time it is run.
            - **Sharper artwork, and no more size ceiling.** Images are streamed to the SD card and decoded from file instead of being held whole in RAM, which lifts the contiguous-heap limit that made large covers fail, and each one is resampled to the exact destination size rather than the nearest power-of-two scale.

            ### Fixes

            - **Single-ROM zips resolve.** A core that reports the archive with no member after it left the ROM unidentified, which also meant RetroAchievements hashed the whole archive instead of the ROM inside. Reported by @kadafi916 in #18.
            - **Neo Geo Pocket Color** is its own system rather than sharing Neo Geo's, and the newer NGPC core — which reports `NGPC` instead of `NeoGeoPocket-Color` — reaches it too.
            - **The running game is identified more carefully.** A ROM resolved into the root of the SD card, a browsed folder reaching identity through `CURRENTPATH`, and zip virtual paths mid-launch are all handled now; arcade sets resolve by `.mra` setname, Neo Geo romsets by the id embedded in the filename, and rom-details candidates are corroborated against the committed game before being trusted.
            - **`known_cores.json` was malformed** and the weekly core audit could not read it.

            ### Notes

            - The display's microSD card must be formatted as **FAT32**. exFAT is not read, and cards over 32 GB usually ship as exFAT.
            - Update both halves as usual: firmware from the web flasher, server through *Update All* / Downloader. If the version panel turns red afterwards, one of the two did not update.

      - name: Build flasher site
        run: |
          mkdir -p site/flasher
          cp docs/flasher/index.html site/flasher/
          cp dist/*.bin site/flasher/
          VER="${GITHUB_REF_NAME}"
          printf '{ "name": "MiSTer Monitor (CYD 2.8-inch ILI9341)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd_ili9341.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd-ili9341.json
          printf '{ "name": "MiSTer Monitor (CYD 2.8-inch ST7789)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd_st7789.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd-st7789.json
          printf '{ "name": "MiSTer Monitor (Tab5)", "version": "%s", "builds": [ { "chipFamily": "ESP32-P4", "parts": [ { "path": "mister_monitor_tab5.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-tab5.json
          printf '{ "name": "MiSTer Monitor (CYD 3.5-inch capacitive)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd35c.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd35c.json
          printf '{ "name": "MiSTer Monitor (CYD 3.5-inch resistive)", "version": "%s", "builds": [ { "chipFamily": "ESP32", "parts": [ { "path": "mister_monitor_cyd35r.bin", "offset": 0 } ] } ] }\n' "$VER" > site/flasher/manifest-cyd35r.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4