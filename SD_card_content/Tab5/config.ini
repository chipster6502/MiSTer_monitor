; =============================================================================
; config.ini  —  MiSTer Monitor configuration file
; =============================================================================
; Place this file in the ROOT of the microSD card (/config.ini).
; Lines starting with ; or # are comments and are ignored.
; Keys are case-sensitive. Values are trimmed of surrounding whitespace.
; Any key that is absent keeps the built-in default shown in the comments.
; =============================================================================


; -----------------------------------------------------------------------------
[wifi]
; -----------------------------------------------------------------------------
ssid=YOUR_WIFI_SSID
password=YOUR_WIFI_PASSWORD


; -----------------------------------------------------------------------------
[mister]
; IP address of the MiSTer. LEAVE BLANK to auto-discover it on the LAN
; (recommended). Set it only as a fallback if your router blocks UDP broadcast.
ip=


; -----------------------------------------------------------------------------
[screenscraper]
; -----------------------------------------------------------------------------
; ss_user / ss_pass  Your free ScreenScraper member account.
; Create one in seconds at https://www.screenscraper.fr (no developer
; account needed — the app provides its own).
;
; Advanced: to use your OWN developer account instead of the built-in one,
; uncomment ss_dev_user / ss_dev_pass and fill them in.

ss_user=YOUR_SCREENSCRAPER_USERNAME
ss_pass=YOUR_SCREENSCRAPER_PASSWORD
;ss_dev_user=
;ss_dev_pass=

; Preferred artwork region: wor (world), us, eu, jp.
; Within each image type token, the region set here is tried FIRST.
; The remaining regions follow in fixed order, and the no-region generic
; variant is tried last.
; Example: region=eu tries (eu) first, then (wor), (us), (jp), then generic.
; Default: wor
region=wor

; HTTP timeout in ms for API requests. Default: 30000
timeout=30000

; Retry attempts on overload. Default: 2
retries=2

; Use HTTPS instead of HTTP. Only enable if HTTP stops working. Default: false
use_https=false


; -----------------------------------------------------------------------------
[gameinfo]
; -----------------------------------------------------------------------------
; GAME INFO panel: synopsis, year, publisher, developer, genre for the game
; in play. Metadata is fetched ONCE per game from ScreenScraper (during the
; artwork download, or on the first visit to the panel for games whose
; artwork was already cached) and stored on the microSD as a .meta file
; next to the game image. After that, the panel loads instantly and offline.

; Preferred language for synopsis and genre labels: en es pt fr de it
; Falls back to English when the preferred language is not available.
; Default: en
info_lang=en

; Synopsis memory cap: maximum characters stored per game (clamped 200-2000).
; This is a memory-safety limit, not a reading-length control: how much of a
; long synopsis you actually read is governed by the scroll keys below. Rarely
; needs changing; lower it only on a board very short on RAM.
; Default: 2000
info_synopsis_max=2000

; Synopsis auto-scroll speed: milliseconds per line (200-8000).
; Higher = slower. Only affects the synopsis, not other scrolling text.
; Default: 2000
info_scroll_step_ms=2000

; Synopsis auto-scroll on/off. When false, the synopsis is shown still (no
; auto-scroll) and the panel holds for 15 s before returning to the image.
; Default: true
info_scroll_auto=true

; Add the GAME INFO panel to the image rotation as a third slide, so the cycle
; reads game image -> game info -> system image. Off by default: existing
; setups keep the two-slide rotation. No effect when [images] image_mode is
; 'game' or 'system', which never rotate.
; Default: false
info_in_rotation=false


; -----------------------------------------------------------------------------
[images]
; -----------------------------------------------------------------------------
; SD card paths. Default: /cores  and  /cores/menu.jpg
base_path=/cores
default_image=/cores/menu.jpg

; While a game is loaded the artwork alternates between the game image and
; the system image; this is how long (ms) each slide stays on screen.
; Default: 30000 (30 s)
core_image_timeout=30000

; Separate dwell (ms) for the system image slide. 0 or absent: same as
; core_image_timeout. Default: 0
system_image_timeout=0

; What the fullscreen image mode shows while a game is loaded:
;   rotate   alternate game artwork and system artwork (default)
;   game     game artwork only, never switches
;   system   system artwork only, never switches
; With 'game' or 'system' the two timeouts above and [gameinfo]
; info_in_rotation have no effect. A game with no artwork of its own still
; falls back to the system image, as it does today.
; Default: rotate
image_mode=rotate

; Grow artwork that is smaller than the display area until it fills it, aspect
; preserved. Off by default, which keeps every image at its source size or
; smaller, as before.
;
; Worth knowing before turning it on: source art is small. A wheel is 600x300
; whatever the game or system, so filling a 1280-wide panel means roughly
; doubling it, and the result looks blocky up close. A screen marquee at
; 1024x512 only needs about a quarter more and holds up well. Boards with
; panels of 480x320 or less already receive art larger than their screen, so
; this setting changes nothing there.
; Default: false
image_upscale=false

; Ceiling on that growth, as a multiplier. Clamped 1.0-2.875. At 2.5 a 600px
; wheel reaches the panel edge while a 320px screenshot stops well short of it
; and keeps its border, which is the intended trade.
; Default: 2.5
image_upscale_max=2.5

; Organise images in lettered subfolders (/cores/A/, /cores/B/, …). Default: true
alphabetical_folders=true

; Automatically download missing artwork from ScreenScraper. Default: true
auto_download=true

; Maximum file size (bytes) for a downloaded image. Default: 500000 (≈488 KB)
max_image_size=500000

; HTTP timeout (ms) for image downloads. Default: 30000
download_timeout=30000

; Force re-download even when a cached file already exists. Default: false
force_core_redownload=false
force_game_redownload=false


; ------------------------------------
; Media type search order
; ------------------------------------
; Each setting is a comma-separated list of tokens tried left to right until
; one downloads successfully. Remove a token to skip that type entirely.
; Reorder freely to match your personal taste.
;
; Available tokens
; ─────────────────────────────────────────────────────────────────────────────
;
; Wheel artwork (logo on a black background):
;   wheel-steel    Steel/metallic border  API: wheel-steel(wor/us/eu/jp)
;   wheel-carbon   Carbon fibre border    API: wheel-carbon(wor/us/eu/jp)
;   wheel          Plain/transparent      API: wheel(wor/us/eu/jp), wheel
;
; Box artwork:
;   box3d          3-D rendered box           API: box-3D(wor/us/eu/jp), box-3D
;   box2d          2-D flat box scan          API: box-2D(wor/us/eu/jp)
;
; Other types:
;   fanart         Fan art
;   marquee        Arcade cabinet marquee header
;   screenshot     In-game screenshot         API: ss, then sstitle
;   titlescreen    Title screen only          API: sstitle
;   photo          Real photograph of hardware
;   illustration   Hardware illustration
;   mix1           MixRBV composite image V1  API: mixrbv1(wor/us/eu/jp)
;   mix2           MixRBV composite image V2  API: mixrbv2(wor/us/eu/jp)
;                  ('mix' still works as an alias of mix2)
;
; System-level only (core_media_order and arcade_subsystem_media_order):
;   screenmarquee  Marquee-style system image; fills the frame
;   background     System wallpaper (not in the default order)
;   photo          Real photograph of the hardware
;   illustration   Hardware illustration
;
; Box and game artwork (box3d, box2d, fanart, marquee, screenshot, mix1,
; mix2) exists per game, not per system, so those tokens only belong in
; game_media_order and arcade_media_order. Listing them in a system order
; just spends requests that cannot succeed.
;
; Within each token, regions are tried in this order:
;   1. The region set in 'region=' above (tried first)
;   2. The remaining regions in fixed order (wor → us → eu → jp), skipping the preferred one
;   3. The generic variant with no region suffix (e.g. box-3D, wheel-steel)
;
; ─────────────────────────────────────────────────────────────────────────────
; Three separate lists for the three download contexts:
; ─────────────────────────────────────────────────────────────────────────────
;
; core_media_order              — system-level artwork (non-arcade systems).  Steel wheels look best here
;                               because they display cleanly on the black background.
;
; arcade_subsystem_media_order  — Arcade subsystem artwork (hardware platform, e.g. CPS1, Sega Classics):
;                               Subsystems are identified by their ScreenScraper system ID, not by game.
;                               Wheel art is the natural choice — these are platform logos, not game covers.
;
; arcade_media_order            — artwork for arcade games.  Most arcade titles
;                               have no physical box, so fanart/marquee art comes first.
;
; game_media_order              — artwork for non-arcade game ROMs (consoles, computers).
;                               Physical box art is the default first choice.
; ─────────────────────────────────────────────────────────────────────────────

; System/core artwork. Default: steel wheel → carbon wheel → plain wheel
;                      → screen marquee → illustration → photo
core_media_order=wheel-steel,wheel-carbon,wheel,screenmarquee,illustration,photo

; Arcade subsystem artwork. Default: steel wheel → carbon wheel → plain wheel
;                           → screen marquee
arcade_subsystem_media_order=wheel-steel,wheel-carbon,wheel,screenmarquee

; Arcade game artwork. Default: fan art → marquee → carbon wheel → steel wheel
;                      → plain wheel → 3D box → 2D box → screenshot
arcade_media_order=fanart,marquee,wheel-carbon,wheel-steel,wheel,box3d,box2d,screenshot

; Non-arcade game artwork. Default: 3D box → 2D box → carbon wheel → steel wheel
;                           → plain wheel → fan art → marquee → screenshot
game_media_order=box3d,box2d,wheel-carbon,wheel-steel,wheel,fanart,marquee,screenshot


; -----------------------------------------------------------------------------
[ui]
; -----------------------------------------------------------------------------
; Rotate the display 180 degrees. Use this when the case holds the board
; upside down — for example cases that put the microSD slot at the bottom.
; Touch rotates with the image, so the buttons stay where you see them.
; Only 180 degrees is offered: 90/270 would leave the panel in portrait, and
; the interface is laid out for a fixed landscape screen.
; Default: false
flip_display=false


; Kiosk mode. The artwork fills the whole panel and the footer strip (game
; name, touch hint, GAME INFO button) is hidden. Tap the screen once to bring
; the strip up over the image; tap again to open the monitor or GAME INFO as
; usual. The strip goes away on its own after kiosk_hide_delay_ms.
;
; Artwork is requested from ScreenScraper at the panel height in this mode, so
; images already cached on the card were fetched shorter and will show a band
; above and below until they are fetched again. To refresh them, set
; force_core_redownload and force_game_redownload to true in [images] for one
; boot, then set them back to false.
; Default: false
kiosk_mode=false

; How long (ms) the footer stays up after a tap before hiding itself again.
; Clamped 500-600000. Default: 5000
kiosk_hide_delay_ms=5000


; Standby. A dimmed black screen with the MiSTer logo slowly breathing at its
; centre, and a small dot in the bottom right corner: cyan while the MiSTer
; answers, orange while it does not. Touch the screen to leave it; it also
; ends on its own as soon as the MiSTer comes back or the core or game changes.
; Uses /cores/logo_standby.jpg from the card, then /cores/logo_mister.jpg;
; with neither, the name is drawn as text. To use a logo of your own, save it
; as a baseline JPEG on a black background, 400x200 at most.

; Screen to show. Only "minimal" is available. Default: minimal
standby_screen=minimal

; Go to standby once the MiSTer has been unreachable for standby_offline_min
; minutes. A single answer from the MiSTer restarts the count. Default: true
standby_when_offline=true

; Minutes without an answer before the MiSTer counts as switched off.
; Clamped 1-1440. Default: 3
standby_offline_min=3

; Also go to standby after this many minutes without a core change, a game
; change, a new achievement or a touch. This happens with the MiSTer running
; too, so a long session on one game will dim the screen. 0 = never.
; Default: 0
standby_idle_min=0

; Backlight level while in standby, 0-255. 0 switches the backlight off.
; Default: 10
standby_brightness=10


; Sound. Boards with a speaker only (Tab5). false silences every tone: the
; boot jingle and the touch-button beeps. Default: true
sound=true

; Speaker volume, 0-255. Default: 128
sound_volume=128


; Scrolling text speed for long game/core names in the footer.

; ms between each character step. Lower = faster. Default: 300
scroll_speed_ms=300

; ms pause at the beginning of a scroll before it starts moving. Default: 2000
scroll_pause_start_ms=2000

; ms pause at the end of a scroll before it resets. Default: 3000
scroll_pause_end_ms=3000


; Web interface. The display serves a small web interface on port 8080 with a
; config.ini editor at http://<display-ip>:8080/config and an SD card browser
; at /files. The display's own IP is shown on the boot screen and on the
; Network page, as "Monitor IP".
; Set to false to disable the whole web interface. Default: true
web_config=true

; Optional password for the web interface. Leave blank for no password, which
; is the usual choice on a home network. If set, the browser asks for it, with
; the username "admin".
; Default: blank
web_password=


; -----------------------------------------------------------------------------
[debug]
; -----------------------------------------------------------------------------
; Enable verbose debug output on the Serial monitor. Default: false
debug=false
